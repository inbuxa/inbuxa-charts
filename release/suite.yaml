# The images the next chart release runs (K-C13): one place, so a chart
# release names exactly one server, webmail and console. Each is a release
# tag of that image. The release workflow checks each image's signature
# against the workflow that signed it, resolves its digest, and pins both
# into the chart; nothing else picks an image.
