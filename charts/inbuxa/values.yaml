#
# Values for the inbuxa chart. Every key here is described in
# values.schema.json, which rejects a key it doesn't know: a typo fails the
# install instead of being ignored.

# Overrides the "inbuxa" in the names of everything the chart creates.
nameOverride: ""
# Overrides the whole name (release name plus chart name).
fullnameOverride: ""

imagePullSecrets: []

server:
  image:
    repository: ghcr.io/inbuxa/inbuxa-server
    # Defaults to the chart's appVersion
    tag: ""
    # sha256:..., which wins over the tag when set
    digest: ""
    pullPolicy: IfNotPresent

  # The data store, written as the server's config.json. Required. A secret
  # in it is a File reference to a path under /etc/inbuxa/secrets, never the
  # secret itself. For example:
  #   "@type": PostgreSql
  #   host: pg-rw.data.svc
  #   port: 5432
  #   database: inbuxa
  #   authUsername: inbuxa
  #   authSecret: {"@type": File, filePath: /etc/inbuxa/secrets/pg-password}
  #   useTls: true
  dataStore: {}

  # Secrets mounted under /etc/inbuxa/secrets, where the data store, blob
  # store and coordinator settings point with File references. Each entry is
  # an existing Secret and the keys to mount from it:
  #   - secretName: inbuxa-data
  #     items: [{key: pg-password, path: pg-password}]
  secretMounts: []

  # The new store's setup, applied once on install, before any server pod
  # starts: the domain, administrator, blob store, coordinator and cluster
  # roles the groups below name. A JMAP request body ("using" and
  # "methodCalls"), the calls an administrator would send to /jmap, run as
  # the system administrator. A value {"$file": /path} is replaced by that
  # file's contents: put secrets in seed.secretMounts, never in the seed.
  # Ignored by a store that's set up already. See the server's --seed.
  seed:
    enabled: false
    # The seed, as values
    request: {}
    # Or an existing ConfigMap with it under the key seed.json
    existingConfigMap: ""
    # Secrets only the seed run sees, at /etc/inbuxa/seed-secrets, in the
    # same form as secretMounts
    secretMounts: []
    timeoutSeconds: 600
    resources: {}

  # Before an upgrade rolls new pods out, a Job on the new image asks the
  # server what the upgrade does to the store, and upgrades it. Give
  # `helm upgrade` a --timeout long enough for it: 20m covers a layout step
  # that has to wait for the old pods' heartbeats to run out.
  upgrade:
    enabled: true
    # A change to the store's layout can't be undone without a backup taken
    # before it. The upgrade refuses one until this names the layout version
    # it moves to (the refusal says which): 3 for the 27.1 crossing.
    acknowledgeLayout: 0
    # When a layout step needs every server pod stopped, scale the server
    # Deployments to 0 first (mail is down until the rollout). Off: the
    # upgrade waits for them to stop, and fails if they don't.
    stopServers: true
    timeoutSeconds: 1800
    resources: {}

  # Where browsers and clients reach the server, as https://host. Sign-in
  # pages and OAuth metadata name it.
  publicUrl: ""

  # The proxies whose X-Forwarded-For the server believes, as CIDRs: the
  # ingress or gateway, and the webmail. The server reads the header so that
  # its limits and bans for failed sign-ins count each client, not the proxy.
  # Empty: loopback and the private ranges, which covers pods on most
  # clusters. List your pod network here if it isn't private (100.64.0.0/10,
  # say).
  trustedProxies: []

  # The port in the pod of each listener a new store gets, which is what
  # the Services send traffic to. 0 leaves that listener out. The pods may
  # listen below 1024 without any privilege: they set the namespaced sysctl
  # net.ipv4.ip_unprivileged_port_start, which Pod Security "restricted"
  # allows. SMTP stays on 25: the server's default rules tell mail from the
  # internet from submissions by local port 25. Used once, when the store is
  # new; after that the listeners are settings in the console, and these
  # have to match them.
  listeners:
    smtp: 25
    submissions: 465
    imaps: 993
    pop3s: 0
    sieve: 4190
    https: 443
    http: 8080

  # The server's role groups, each a Deployment. INBUXA_ROLE names a role
  # (a ClusterRole in the server's registry) that says which background
  # tasks the group runs; an empty role runs them all.
  groups:
    # Client protocols, web and JMAP; no outbound delivery, no scheduler
    front:
      enabled: true
      replicas: 2
      role: peer
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
      podAnnotations: {}
      # Extra labels on the pods, for what selects them by label: an egress
      # gateway policy, say. Not app.kubernetes.io/ or inbuxa.org/ ones.
      podLabels: {}
      extraEnv: []
    # As front, plus outbound delivery. Place it where its egress address
    # is the one your SPF and PTR records name: on nodes with a fixed
    # address (nodeSelector, tolerations), or behind an egress gateway that
    # selects it (podLabels). server.egress checks it.
    mta:
      enabled: true
      replicas: 2
      role: peer-mta
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
      podAnnotations: {}
      # Extra labels on the pods, for what selects them by label: an egress
      # gateway policy, say. Not app.kubernetes.io/ or inbuxa.org/ ones.
      podLabels: {}
      extraEnv: []
    # Everything, including the task scheduler. Exactly one replica: a
    # second would queue every maintenance task twice.
    core:
      enabled: true
      replicas: 1
      role: ""
      resources: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
      podAnnotations: {}
      # Extra labels on the pods, for what selects them by label: an egress
      # gateway policy, say. Not app.kubernetes.io/ or inbuxa.org/ ones.
      podLabels: {}
      extraEnv: []

  # The addresses outbound mail should leave from: the ones with reverse
  # DNS (PTR) records and in your SPF. When set, a Job placed like the mta
  # pods asks checkUrl which address it came from after each install and
  # upgrade, and records the answer on the mta Deployment as an event: a
  # Warning when it isn't one of these (kubectl get events). checkUrl answers
  # a GET with the caller's address as plain text; pick one you trust, as it
  # sees your cluster's address.
  egress:
    expectedAddresses: []
    checkUrl: ""

  # Used for every group that sets no resources of its own
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # Time for SMTP sessions in progress to finish when a pod stops
  terminationGracePeriodSeconds: 120

  # Pods of a group are spread across nodes (never two on one node while
  # another node has room) and, where the cluster has zones, across zones.
  topologySpread:
    nodes: DoNotSchedule
    zones: ScheduleAnyway

  # At most this many pods of a group down at once for a drain or upgrade
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  services:
    # Web, JMAP and the API, inside the cluster. Front ends and an Ingress
    # or Gateway route point here.
    http:
      type: ClusterIP
      annotations: {}
      groups: [front, core]
    # Mail from outside, on the standard ports. Local keeps each client's
    # own address (no SNAT): the load balancer sends only to nodes running a
    # mail pod.
    mail:
      enabled: true
      type: LoadBalancer
      externalTrafficPolicy: Local
      loadBalancerClass: ""
      loadBalancerIP: ""
      annotations: {}
      groups: [front, mta]
      ports:
        smtp: 25
        submissions: 465
        imaps: 993
        pop3s: 995
        sieve: 4190

# The webmail, signing people in through the server's own page (OAuth). Off
# by default: it needs its own address, and the server's publicUrl.
webmail:
  enabled: false
  image:
    repository: ghcr.io/inbuxa/inbuxa-webmail
    # The webmail's own release (27.1-rc.N); it's versioned apart from the
    # server, so there's no default. Needs 27.1-rc.7 or later.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Where browsers reach it, as https://host. Required. The server registers
  # it as an OAuth client with this address.
  publicUrl: ""
  replicas: 2
  # A Secret with app-secret (seals sessions; the same on every replica) and
  # oauth-client-secret (the server holds it too). Empty: the chart makes one
  # with random values and keeps them across upgrades. The webmail reads both
  # as files, never from its environment.
  existingSecret: ""
  # While rotating app-secret: true, with the old value(s), comma-separated,
  # under app-secret-previous in existingSecret. Sessions sealed with them
  # still open. Set it back to false once they have expired.
  previousAppSecret: false
  # Addresses whose X-Forwarded-For the webmail believes, as CIDRs. Empty:
  # the private ranges, which covers an ingress inside the cluster.
  trustedProxies: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  extraEnv: []

# INBUXA Admin, the console, served as static files; the browser talks to
# the server's publicUrl directly. Off by default, like the webmail.
console:
  enabled: false
  image:
    repository: ghcr.io/inbuxa/inbuxa-admin
    # The console's own release (27.1-rc.N); no default, as for the webmail
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Where browsers reach it, as https://host. Required. The server registers
  # it as an OAuth client and lets its origin call the API.
  publicUrl: ""
  replicas: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# NetworkPolicies: every pod the chart makes denies all traffic in and out
# except what it needs (templates/networkpolicy.yaml has the map). They need
# a CNI that enforces them.
networkPolicy:
  enabled: true
  # Who may reach the HTTP ports of the server, the webmail and the console:
  # your ingress controller or gateway, as NetworkPolicy peers, e.g.
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
  # Empty: from anywhere. The webmail always reaches the server.
  httpFrom: []
  # Where the server and its Jobs may connect, as NetworkPolicy egress rules,
  # besides DNS. Empty: anywhere, which a mail server needs to deliver mail
  # unless it hands everything to a relay. Narrow it to your data store,
  # relay and the Kubernetes API (for the upgrade Job) if you can.
  serverEgress: []
  # The webmail fetches remote images in mail and subscribed calendars over
  # HTTP and HTTPS. Off: only the server.
  webmailInternet: true

# Routes from outside to the server's publicUrl, the webmail's and the
# console's, each by its host name. Gateway API where the cluster has it;
# an Ingress where it doesn't. TLS is the Gateway's or the Ingress's.
routes:
  gateway:
    enabled: false
    # The Gateway listeners to attach to, e.g. [{name: public, namespace: gateway}]
    parentRefs: []
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # As an Ingress takes it, e.g. [{hosts: [mail.example.org], secretName: mail-tls}]
    tls: []
