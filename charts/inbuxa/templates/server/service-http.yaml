{{/*
SPDX-FileCopyrightText: 2026 Coffey Labs LLC
SPDX-License-Identifier: Apache-2.0

Web, JMAP and the management API, inside the cluster. A selector can't say
"any of these groups", so the pods of each group listed carry
inbuxa.org/serves-http, and this selects that.
*/}}
{{- $root := . }}
{{- $svc := .Values.server.services.http }}
{{- range $group := $svc.groups }}
{{- if not (index $root.Values.server.groups $group).enabled }}
{{- fail (printf "server.services.http.groups names %q, which is not enabled" $group) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inbuxa.fullname" . }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inbuxa.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  selector:
    {{- include "inbuxa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
    inbuxa.org/serves-http: "true"
  ports:
    {{- if .Values.server.listeners.https }}
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    {{- end }}
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
