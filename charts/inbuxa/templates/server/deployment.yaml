{{/*
SPDX-FileCopyrightText: 2026 Coffey Labs LLC
SPDX-License-Identifier: Apache-2.0

One Deployment per server role group. Node identity comes from the pod
(INBUXA_HOSTNAME is the pod name) and node ids from the store, so the pods
are interchangeable: Deployments, not StatefulSets.
*/}}
{{- $root := . }}
{{- $server := .Values.server }}
{{- $tlsSecrets := splitList " " (include "inbuxa.server.tlsSecrets" $root) | compact }}
{{- range $group := list "front" "mta" "core" }}
{{- $g := index $server.groups $group }}
{{- if $g.enabled }}
{{- $labels := include "inbuxa.server.selectorLabels" (dict "root" $root "group" $group) }}
{{- $proxyListeners := "" }}
{{- if has $group $server.services.mail.groups }}
{{- $proxyListeners = include "inbuxa.server.proxyListeners" $root }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inbuxa.fullname" $root }}-{{ $group }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "inbuxa.labels" $root | nindent 4 }}
    app.kubernetes.io/component: server
    inbuxa.org/group: {{ $group }}
  {{- if $root.Values.webmail.enabled }}
  annotations:
    ignore-check.kube-linter.io/env-var-secret: "INBUXA_WEBMAIL_CLIENT_SECRET_FILE holds a path to the mounted secret, not the secret"
  {{- end }}
spec:
  replicas: {{ $g.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- if eq $group "core" }}
      # Never two cores at once, not even for a moment during a rollout
      maxSurge: 0
      maxUnavailable: 1
      {{- else }}
      maxSurge: 1
      maxUnavailable: 0
      {{- end }}
  template:
    metadata:
      labels:
        {{- with $g.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "inbuxa.labels" $root | nindent 8 }}
        app.kubernetes.io/component: server
        inbuxa.org/group: {{ $group }}
        {{- if has $group $server.services.http.groups }}
        inbuxa.org/serves-http: "true"
        {{- end }}
        {{- if and $server.services.mail.enabled (has $group $server.services.mail.groups) }}
        inbuxa.org/serves-mail: "true"
        {{- end }}
      annotations:
        checksum/config: {{ toJson $server.dataStore | sha256sum }}
        {{- with $g.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ $server.terminationGracePeriodSeconds }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- $lowest := 65536 }}
        {{- range $name, $port := $server.listeners }}
        {{- if and (gt (int $port) 0) (lt (int $port) (int $lowest)) }}{{ $lowest = int $port }}{{ end }}
        {{- end }}
        {{- if lt (int $lowest) 1024 }}
        # Lets the unprivileged server listen from the lowest listener port
        # up, with no capability. Namespaced to the pod, and one of the
        # sysctls Pod Security "restricted" allows.
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: {{ $lowest | quote }}
        {{- end }}
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      {{- if or (ne $server.topologySpread.nodes "off") (ne $server.topologySpread.zones "off") }}
      topologySpreadConstraints:
        {{- if ne $server.topologySpread.nodes "off" }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ $server.topologySpread.nodes }}
          labelSelector:
            matchLabels:
              {{- $labels | nindent 14 }}
        {{- end }}
        {{- if ne $server.topologySpread.zones "off" }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ $server.topologySpread.zones }}
          labelSelector:
            matchLabels:
              {{- $labels | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $server.check.enabled }}
      initContainers:
        # The data layer can be used, or the pod's status says which part
        # can't, and why (server --check: exit 78 bad configuration,
        # 69 unreachable, 77 credentials refused, 76 TLS failed)
        - name: check
          image: {{ include "inbuxa.server.image" $root }}
          imagePullPolicy: {{ $server.image.pullPolicy }}
          args: ["--config", "/etc/inbuxa/config.json", "--check"]
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: INBUXA_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with $g.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $server.check.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/inbuxa/config.json
              subPath: config.json
              readOnly: true
            {{- if $server.secretMounts }}
            - name: secrets
              mountPath: /etc/inbuxa/secrets
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: server
          image: {{ include "inbuxa.server.image" $root }}
          imagePullPolicy: {{ $server.image.pullPolicy }}
          args: ["--config", "/etc/inbuxa/config.json"]
          # A start that can't open the data store says why on its last lines
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: INBUXA_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if $g.role }}
            - name: INBUXA_ROLE
              value: {{ $g.role | quote }}
            {{- end }}
            {{- if $server.publicUrl }}
            - name: INBUXA_PUBLIC_URL
              value: {{ $server.publicUrl | quote }}
            {{- end }}
            - name: INBUXA_LISTENER_PORTS
              value: {{ include "inbuxa.server.listenerPorts" $root | quote }}
            # Reached only through the ingress or gateway and the webmail:
            # count each client by the address they pass on, so failed
            # sign-ins and anonymous requests aren't charged to the proxy
            - name: INBUXA_HTTP_USE_FORWARDED
              value: "true"
            {{- if $tlsSecrets }}
            # Certificates from TLS Secrets, reread when they're renewed
            - name: INBUXA_TLS_CERTIFICATE_DIRS
              value: {{ include "inbuxa.server.tlsDirs" $tlsSecrets | quote }}
            {{- end }}
            {{- with $server.trustedProxies }}
            - name: INBUXA_HTTP_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if $proxyListeners }}
            # PROXY protocol copies of the mail listeners, believed from
            # the load balancer only
            - name: INBUXA_MAIL_PROXY_LISTENERS
              value: {{ $proxyListeners | quote }}
            - name: INBUXA_MAIL_PROXY_TRUSTED_NETWORKS
              value: {{ join "," $server.services.mail.proxyProtocol.trustedNetworks | quote }}
            {{- end }}
            {{- /* The front ends, registered as OAuth clients on every start */}}
            {{- with $root.Values.webmail }}
            {{- if .enabled }}
            - name: INBUXA_WEBMAIL_URL
              value: {{ trimSuffix "/" .publicUrl | quote }}
            # A file, not the environment (K-S2)
            - name: INBUXA_WEBMAIL_CLIENT_SECRET_FILE
              value: /etc/inbuxa/webmail/oauth-client-secret
            {{- end }}
            {{- end }}
            {{- if $root.Values.console.enabled }}
            - name: INBUXA_ADMIN_URL
              value: {{ trimSuffix "/" $root.Values.console.publicUrl | quote }}
            {{- end }}
            {{- with $server.metrics }}
            {{- if .prometheus.enabled }}
            # /metrics/prometheus, behind this username and password (K-C10)
            - name: INBUXA_METRICS_PROMETHEUS_USERNAME
              value: {{ .prometheus.username | quote }}
            - name: INBUXA_METRICS_PROMETHEUS_SECRET_FILE
              value: /etc/inbuxa/metrics/password
            {{- end }}
            {{- if .otlp.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .otlp.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .otlp.protocol | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ mul (int .otlp.intervalSeconds) 1000 | quote }}
            - name: OTEL_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "service.instance.id=$(OTEL_POD_NAME),k8s.pod.name=$(OTEL_POD_NAME),k8s.namespace.name=%s,k8s.deployment.name=%s-%s,inbuxa.group=%s" $root.Release.Namespace (include "inbuxa.fullname" $root) $group $group | quote }}
            {{- if .otlp.headersSecret }}
            # A file, not the environment: the headers carry the token
            - name: INBUXA_OTLP_HEADERS_FILE
              value: /etc/inbuxa/otlp/headers
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $g.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- range $name := list "smtp" "submissions" "imaps" "pop3s" "sieve" "https" "http" }}
            {{- $port := int (index $server.listeners $name) }}
            {{- if $port }}
            - name: {{ $name }}
              containerPort: {{ $port }}
              protocol: TCP
            {{- end }}
            {{- end }}
            {{- range $item := splitList "," $proxyListeners }}
            {{- if $item }}
            {{- $kv := splitList "=" $item }}
            - name: p-{{ index $kv 0 }}
              containerPort: {{ index $kv 1 }}
              protocol: TCP
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            # A first start on a new or upgraded store can take a while
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          {{- if gt (int $server.shutdownDelaySeconds) 0 }}
          {{- if ge (int $server.shutdownDelaySeconds) (int $server.terminationGracePeriodSeconds) }}
          {{- fail "server.shutdownDelaySeconds must be less than server.terminationGracePeriodSeconds" }}
          {{- end }}
          lifecycle:
            # Keeps serving while the pod leaves the Services' endpoints
            preStop:
              sleep:
                seconds: {{ int $server.shutdownDelaySeconds }}
          {{- end }}
          readinessProbe:
            # Ready while the data store answers
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml (default $server.resources $g.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/inbuxa/config.json
              subPath: config.json
              readOnly: true
            {{- if $server.secretMounts }}
            - name: secrets
              mountPath: /etc/inbuxa/secrets
              readOnly: true
            {{- end }}
            {{- if $root.Values.webmail.enabled }}
            - name: webmail
              mountPath: /etc/inbuxa/webmail
              readOnly: true
            {{- end }}
            {{- range $i, $name := $tlsSecrets }}
            # A whole directory, never a subPath: a renewal reaches the pod
            - name: tls-{{ $i }}
              mountPath: /etc/inbuxa/tls/{{ $name }}
              readOnly: true
            {{- end }}
            {{- if $server.metrics.prometheus.enabled }}
            - name: metrics
              mountPath: /etc/inbuxa/metrics
              readOnly: true
            {{- end }}
            {{- if and $server.metrics.otlp.enabled $server.metrics.otlp.headersSecret }}
            - name: otlp
              mountPath: /etc/inbuxa/otlp
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /var/lib/inbuxa
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "inbuxa.fullname" $root }}-server
        {{- if $server.secretMounts }}
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              {{- range $server.secretMounts }}
              - secret:
                  name: {{ .secretName }}
                  items:
                    {{- toYaml .items | nindent 20 }}
              {{- end }}
        {{- end }}
        {{- with $root.Values.webmail }}
        {{- if .enabled }}
        # The webmail's OAuth client secret, which the server registers it with
        - name: webmail
          secret:
            secretName: {{ default (printf "%s-webmail" (include "inbuxa.fullname" $root)) .existingSecret }}
            defaultMode: 0440
            items:
              - key: oauth-client-secret
                path: oauth-client-secret
        {{- end }}
        {{- end }}
        {{- range $i, $name := $tlsSecrets }}
        - name: tls-{{ $i }}
          secret:
            secretName: {{ $name }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        {{- end }}
        {{- if $server.metrics.prometheus.enabled }}
        - name: metrics
          secret:
            secretName: {{ include "inbuxa.server.metricsSecret" $root }}
            defaultMode: 0440
            items:
              - key: password
                path: password
        {{- end }}
        {{- if and $server.metrics.otlp.enabled $server.metrics.otlp.headersSecret }}
        - name: otlp
          secret:
            secretName: {{ $server.metrics.otlp.headersSecret }}
            defaultMode: 0440
            items:
              - key: headers
                path: headers
        {{- end }}
        # Scratch only: everything lasting is in the data store
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
