suite: install notes
templates:
  - NOTES.txt
release:
  name: mail
  namespace: inbuxa
tests:
  - it: names the release and its namespace
    asserts:
      - matchRegexRaw:
          pattern: 'installed as "mail" in namespace "inbuxa"'
  - it: points at the guide
    asserts:
      - matchRegexRaw:
          pattern: https://docs\.inbuxa\.org/
