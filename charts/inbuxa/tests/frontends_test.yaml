suite: webmail, console and routes
templates:
  - webmail.yaml
  - console.yaml
  - routes.yaml
  - server/deployment.yaml
release:
  name: mail
  namespace: inbuxa
values:
  - ../ci/defaults-values.yaml
set:
  server.publicUrl: https://mail.example.org
  webmail.enabled: true
  webmail.publicUrl: https://webmail.example.org
  webmail.image.tag: 27.1-rc.7
  console.enabled: true
  console.publicUrl: https://admin.example.org/
  console.image.tag: 27.1-rc.21
tests:
  - it: is off by default
    set:
      webmail.enabled: false
      console.enabled: false
    template: webmail.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: runs the webmail with sealed-cookie sessions, talking to the server inside the cluster
    template: webmail.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/inbuxa/inbuxa-webmail:27.1-rc.7
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAIL_SERVER_URL, value: "http://mail-inbuxa-http.inbuxa.svc:8080"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SESSION_BACKEND, value: cookie}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SECURE_COOKIES, value: "1"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ADMIN_URL, value: "https://admin.example.org"}
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: gives the webmail its secrets as files, and has it check its read-only root
    template: webmail.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: APP_SECRET_FILE, value: /etc/inbuxa-webmail/app-secret}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OAUTH_CLIENT_SECRET_FILE, value: /etc/inbuxa-webmail/oauth-client-secret}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: IMMUTABLE, value: "1"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: APP_SECRET_PREVIOUS_FILE, value: /etc/inbuxa-webmail/app-secret-previous}
      - contains:
          path: spec.template.spec.volumes
          content: {name: secrets, secret: {secretName: mail-inbuxa-webmail, defaultMode: 0440}}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: secrets, mountPath: /etc/inbuxa-webmail, readOnly: true}
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: makes the webmail's secrets when none is given
    template: webmail.yaml
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - exists:
          path: data["app-secret"]
      - exists:
          path: data["oauth-client-secret"]

  - it: uses the operator's Secret when given one
    template: webmail.yaml
    set:
      webmail.existingSecret: my-webmail
    asserts:
      - hasDocuments:
          count: 3
      - contains:
          path: spec.template.spec.volumes
          content: {name: secrets, secret: {secretName: my-webmail, defaultMode: 0440}}
        documentSelector:
          path: kind
          value: Deployment

  - it: reads the old app secret while rotating, from the operator's Secret only
    template: webmail.yaml
    set:
      webmail.existingSecret: my-webmail
      webmail.previousAppSecret: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: APP_SECRET_PREVIOUS_FILE, value: /etc/inbuxa-webmail/app-secret-previous}

  - it: refuses previousAppSecret on the chart's own Secret
    template: webmail.yaml
    set:
      webmail.previousAppSecret: true
    asserts:
      - failedTemplate:
          errorPattern: "previousAppSecret needs webmail.existingSecret"

  - it: refuses PUSH_URL with more than one replica
    template: webmail.yaml
    set:
      webmail.extraEnv: [{name: PUSH_URL, value: "https://webmail.example.org"}]
    asserts:
      - failedTemplate:
          errorPattern: "PUSH_URL \\(push by subscription\\) works with one webmail replica only"

  - it: refuses PUSH_URL with autoscaling, even from one replica
    template: webmail.yaml
    set:
      webmail.replicas: 1
      webmail.autoscaling.enabled: true
      webmail.extraEnv: [{name: PUSH_URL, value: "https://webmail.example.org"}]
    asserts:
      - failedTemplate:
          errorPattern: "works with one webmail replica only"

  - it: takes PUSH_URL with one replica
    template: webmail.yaml
    set:
      webmail.replicas: 1
      webmail.extraEnv: [{name: PUSH_URL, value: "https://webmail.example.org"}]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PUSH_URL, value: "https://webmail.example.org"}
        documentSelector:
          path: kind
          value: Deployment

  - it: tells every server pod about the webmail and the console, so it registers them
    template: server/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: INBUXA_WEBMAIL_URL, value: "https://webmail.example.org"}
      # From a file, never the environment
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: INBUXA_WEBMAIL_CLIENT_SECRET_FILE, value: /etc/inbuxa/webmail/oauth-client-secret}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: INBUXA_WEBMAIL_CLIENT_SECRET}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: webmail
            secret:
              secretName: mail-inbuxa-webmail
              defaultMode: 0440
              items: [{key: oauth-client-secret, path: oauth-client-secret}]
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: webmail, mountPath: /etc/inbuxa/webmail, readOnly: true}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: INBUXA_ADMIN_URL, value: "https://admin.example.org"}

  - it: points the console's browser at the server
    template: console.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value: [{name: API_BASE_URL, value: "https://mail.example.org"}]
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 101

  - it: scales with an autoscaler instead of a fixed count
    template: webmail.yaml
    set:
      webmail.autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.minReplicas
          value: 2
        documentSelector:
          path: kind
          value: HorizontalPodAutoscaler

  - it: needs a release to run, an address, and the server's address
    template: webmail.yaml
    set:
      webmail.image.tag: ""
    asserts:
      - failedTemplate:
          errorPattern: "webmail.image.tag: set the webmail release"

  - it: refuses an address with a path (the schema)
    template: console.yaml
    set:
      console.publicUrl: https://example.org/admin
    asserts:
      - failedTemplate:
          errorPattern: "console.publicUrl"

  - it: needs the server's publicUrl
    template: webmail.yaml
    set:
      server.publicUrl: ""
    asserts:
      - failedTemplate:
          errorPattern: "set server.publicUrl too"

  - it: routes each address to its Service through a Gateway
    template: routes.yaml
    set:
      routes.gateway.enabled: true
      routes.gateway.parentRefs: [{name: public, namespace: gateway}]
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.hostnames
          value: [webmail.example.org]
        documentIndex: 1
      - equal:
          path: spec.rules[0].backendRefs[0]
          value: {name: mail-inbuxa-webmail, port: 8080}
        documentIndex: 1
      - equal:
          path: spec.parentRefs
          value: [{name: public, namespace: gateway}]
        documentIndex: 2

  - it: or through one Ingress
    template: routes.yaml
    set:
      routes.ingress.enabled: true
      routes.ingress.className: nginx
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].host
          value: mail.example.org
      - equal:
          path: spec.rules[1].host
          value: webmail.example.org
      - equal:
          path: spec.rules[2].http.paths[0].backend.service.name
          value: mail-inbuxa-console

  - it: refuses two front ends on one host name
    template: routes.yaml
    set:
      console.publicUrl: https://webmail.example.org
      routes.ingress.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "webmail and console both have the host webmail.example.org"

  - it: refuses a Gateway route with nothing to attach to
    template: routes.yaml
    set:
      routes.gateway.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "routes.gateway.parentRefs"

  - it: sends the ACME challenges for the mail host names to the server
    template: routes.yaml
    set:
      routes.gateway.enabled: true
      routes.gateway.parentRefs: [{name: public, namespace: gateway}]
      server.certificates.acmeHosts: [mx.example.org, mail.example.org, mx.example.org]
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: mail-inbuxa-acme
        documentIndex: 3
      - equal:
          path: spec.hostnames
          value: [mx.example.org]
        documentIndex: 3
      - equal:
          path: spec.rules[0]
          value:
            matches: [{path: {type: PathPrefix, value: /.well-known/acme-challenge/}}]
            backendRefs: [{name: mail-inbuxa-http, port: 8080}]
        documentIndex: 3

  - it: and through the Ingress
    template: routes.yaml
    set:
      routes.ingress.enabled: true
      server.certificates.acmeHosts: [mx.example.org]
    asserts:
      - equal:
          path: spec.rules[3]
          value:
            host: mx.example.org
            http:
              paths:
                - path: /.well-known/acme-challenge/
                  pathType: Prefix
                  backend: {service: {name: mail-inbuxa-http, port: {name: http}}}

  - it: refuses an ACME host that's a front end's
    template: routes.yaml
    set:
      routes.ingress.enabled: true
      server.certificates.acmeHosts: [webmail.example.org]
    asserts:
      - failedTemplate:
          errorPattern: "webmail.example.org is the webmail's host"

  - it: refuses ACME hosts with no routes to carry them
    template: routes.yaml
    set:
      server.certificates.acmeHosts: [mx.example.org]
    asserts:
      - failedTemplate:
          errorPattern: "turn on routes.gateway or routes.ingress"

  - it: refuses to make the webmail's Secret when generateSecrets is off (K-C14)
    template: webmail.yaml
    set:
      generateSecrets: false
    asserts:
      - failedTemplate:
          errorPattern: "webmail.existingSecret: generateSecrets is off"

  - it: renders with generateSecrets off once the Secret is named
    template: webmail.yaml
    set:
      generateSecrets: false
      webmail.existingSecret: my-webmail
    asserts:
      - notFailedTemplate: {}
      # No Secret of its own: the Deployment comes first
      - isKind:
          of: Deployment
        documentIndex: 0
